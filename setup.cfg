[flake8]
max-line-length = 100
# E203 and W503 conflict with black's formatting; ignore them for compatibility.
extend-ignore = E203, W503
# The stage scripts under pyspark/ are intentionally left untouched during the
# scaffolding phase (they are migrated/linted in later per-stage PRs), so they
# are excluded from linting for now.
exclude =
    .git,
    __pycache__,
    pyspark,
    build,
    dist
